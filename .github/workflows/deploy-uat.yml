# UAT — déploiement automatique à chaque merge sur le tronc.
#
# Un environnement n'est pas une branche : c'est un artefact déployé
# (documentation/adr/003-tronc-unique-et-flow.md). Il n'existe donc AUCUNE
# branche `uat`. Le déploiement se fait par **digest** `sha256:`, jamais par
# tag mobile (rules/interdictions.md).
name: Deploy UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Pas d'annulation en cours de route : un déploiement interrompu laisse
  # l'environnement dans un état indéterminé.
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Aucun déploiement sans CI verte sur le commit exact.
  guard:
    name: CI verte sur ce commit
    runs-on: ubuntu-latest
    steps:
      - name: Attend la conclusion du workflow CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            STATUS=$(gh run list --commit "$GITHUB_SHA" --workflow CI \
              --json status,conclusion \
              --jq '[.[] | select(.status=="completed")] | first | .conclusion // "pending"')
            case "$STATUS" in
              success) echo "CI verte."; exit 0 ;;
              pending) echo "CI en cours ($i/90)…"; sleep 20 ;;
              *)       echo "::error::CI en échec ($STATUS) — déploiement refusé"; exit 1 ;;
            esac
          done
          echo "::error::timeout en attendant la CI"; exit 1

  images:
    name: Image ${{ matrix.cmd }}
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_digest: ${{ steps.export.outputs.server_digest }}
      worker_digest: ${{ steps.export.outputs.worker_digest }}
    strategy:
      matrix:
        cmd: [server, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.cmd }}:sha-${{ github.sha }}
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=uat-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}

      - id: export
        run: echo "${{ matrix.cmd }}_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Déploie UAT
    needs: [images]
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: ${{ vars.UAT_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UAT_VPS_SSH_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.UAT_VPS_PORT || '22' }}" -H "${{ secrets.UAT_VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Manifeste et migrations
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.UAT_VPS_PORT || '22' }}" \
            deploy/ migrations/ \
            "${{ secrets.UAT_VPS_USER }}@${{ secrets.UAT_VPS_IP }}:/opt/hexa-uat/"

      - name: Migrations puis bascule (par digest)
        env:
          PORT: ${{ secrets.UAT_VPS_PORT || '22' }}
          HOST: ${{ secrets.UAT_VPS_USER }}@${{ secrets.UAT_VPS_IP }}
          SERVER_DIGEST: ${{ needs.images.outputs.server_digest }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker_digest }}
        run: |
          ssh -p "$PORT" "$HOST" \
            "SERVER_IMAGE=ghcr.io/${{ github.repository }}/server@$SERVER_DIGEST \
             WORKER_IMAGE=ghcr.io/${{ github.repository }}/worker@$WORKER_DIGEST \
             bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/hexa-uat
            export SERVER_IMAGE WORKER_IMAGE
            docker compose -f docker-compose.deploy.yml pull
            # Migrations avant le nouveau code : elles DOIVENT être
            # rétro-compatibles avec la version N-1 (rules/donnees-et-migrations.md).
            docker compose -f docker-compose.deploy.yml run --rm migrate
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
          REMOTE

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.UAT_PUBLIC_URL }}/healthz" >/dev/null; then
              echo "UAT en ligne."; exit 0
            fi
            sleep 2
          done
          echo "::error::smoke test UAT en échec"; exit 1

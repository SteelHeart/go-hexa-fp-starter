# Production — déclenché par un tag `v*`, et **manuel** : l'environnement
# GitHub `production` exige une approbation humaine avant le job `deploy`.
#
# Un tag est immuable et désigne exactement ce qui tourne. L'image est
# déployée par **digest** `sha256:` — un tag de registre est réinscriptible,
# un digest non (rules/interdictions.md).
name: Deploy Production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à déployer (ex: v0.1.0)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: CI verte sur le commit taggé
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Le tag est-il un ancêtre de main ?
        run: |
          set -euo pipefail
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::ce tag n'est pas sur le tronc — un correctif urgent doit être reporté sur main (rules/workflow-git.md §6)"
            exit 1
          fi

      - name: Conclusion du workflow CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.sha }}"
          for i in $(seq 1 90); do
            STATUS=$(gh run list --commit "$SHA" --workflow CI --json status,conclusion \
              --jq '[.[] | select(.status=="completed")] | first | .conclusion // "pending"')
            case "$STATUS" in
              success) echo "CI verte sur $SHA."; exit 0 ;;
              pending) echo "CI en cours ($i/90)…"; sleep 20 ;;
              *)       echo "::error::CI en échec ($STATUS) — déploiement refusé"; exit 1 ;;
            esac
          done
          echo "::error::timeout en attendant la CI"; exit 1

  images:
    name: Image ${{ matrix.cmd }}
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      server_digest: ${{ steps.export.outputs.server_digest }}
      worker_digest: ${{ steps.export.outputs.worker_digest }}
    strategy:
      matrix:
        cmd: [server, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.cmd }}:${{ needs.guard.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.cmd }}:sha-${{ needs.guard.outputs.sha }}
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ needs.guard.outputs.version }}
            COMMIT=${{ needs.guard.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}

      # L'attestation lie l'image au workflow, au dépôt et au commit qui l'ont
      # produite : c'est ce qui permet de refuser une image non tracée.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.cmd }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - id: export
        run: echo "${{ matrix.cmd }}_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Déploie production
    needs: [guard, images]
    runs-on: ubuntu-latest
    # ⚠️ Configurer l'environnement `production` avec un « required reviewer ».
    # Sans cela, ce job part sans approbation.
    environment:
      name: production
      url: ${{ vars.PROD_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Clé SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Manifeste et migrations
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.VPS_PORT || '22' }}" \
            deploy/ migrations/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/opt/hexa-prod/"

      - name: Sauvegarde, migrations, bascule (par digest)
        id: rollout
        env:
          PORT: ${{ secrets.VPS_PORT || '22' }}
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}
          SERVER_DIGEST: ${{ needs.images.outputs.server_digest }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker_digest }}
        run: |
          ssh -p "$PORT" "$HOST" \
            "SERVER_IMAGE=ghcr.io/${{ github.repository }}/server@$SERVER_DIGEST \
             WORKER_IMAGE=ghcr.io/${{ github.repository }}/worker@$WORKER_DIGEST \
             bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/hexa-prod
            export SERVER_IMAGE WORKER_IMAGE

            # L'état déployé précédent, pour un rollback par digest.
            docker compose -f docker-compose.deploy.yml config \
              | grep -E 'image:.*@sha256:' > .previous-images || true

            # 1. Sauvegarde AVANT migration : c'est le seul rollback fiable.
            mkdir -p backups
            docker compose -f docker-compose.deploy.yml exec -T postgres \
              pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" \
              | gzip > "backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            ls -1t backups/*.sql.gz | tail -n +15 | xargs -r rm --

            # 2. Migrations rétro-compatibles, puis nouveau code.
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml run --rm migrate
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
          REMOTE

      - name: Smoke test
        id: smoke
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PROD_PUBLIC_URL }}/healthz" >/dev/null; then
              echo "Production en ligne."; exit 0
            fi
            sleep 2
          done
          echo "::error::smoke test production en échec"; exit 1

      - name: Rollback si le smoke test échoue
        if: failure() && steps.rollout.outcome == 'success'
        env:
          PORT: ${{ secrets.VPS_PORT || '22' }}
          HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}
        run: |
          ssh -p "$PORT" "$HOST" bash -euo pipefail <<'REMOTE'
            cd /opt/hexa-prod
            # Les digests précédents ont été capturés avant la bascule.
            SERVER_IMAGE=$(grep -m1 '/server@' .previous-images | sed 's/.*image: //')
            WORKER_IMAGE=$(grep -m1 '/worker@' .previous-images | sed 's/.*image: //')
            export SERVER_IMAGE WORKER_IMAGE
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
          REMOTE
          echo "::warning::rollback du code effectué. La migration N'EST PAS annulée — c'est pourquoi elle doit être rétro-compatible."

  release:
    name: Publie la release
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Notes de version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.guard.outputs.version }}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)
          {
            if [ -n "$PREV" ]; then
              echo "## Changements depuis $PREV"
              git log --no-merges --pretty='- %s' "${PREV}..HEAD"
            else
              echo "## Première release"
              git log --no-merges --pretty='- %s'
            fi
            echo ""
            echo "### Images (déployées par digest)"
            echo '```'
            echo "server: ${{ needs.images.outputs.server_digest }}"
            echo "worker: ${{ needs.images.outputs.worker_digest }}"
            echo '```'
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md || \
            gh release edit "$TAG" --notes-file notes.md

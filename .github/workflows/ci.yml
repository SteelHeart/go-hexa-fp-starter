name: CI

on:
  push:
    branches: [main]
  # AUCUN filtre `branches:` ici, et c'est délibéré : une PR est contrôlée
  # quelle que soit sa base. Avec `branches: [main]`, toute la pile de travail
  # — dont les PR visent une branche d'intégration — n'affichait « no checks
  # reported », c'est-à-dire une case VIDE, jamais une case rouge. Et une case
  # vide se fusionne (#64).
  #
  # C'est le défaut de forme de l'ADR 013 appliqué au déclencheur lui-même :
  # l'absence de contrôle ressemble en tout point à l'absence de problème.
  #
  # Le coût est borné par `concurrency` ci-dessous : une nouvelle poussée
  # annule le run précédent.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
  workflow_dispatch:

# Une nouvelle poussée sur une PR annule le run précédent : on ne paie pas
# deux fois pour un état obsolète.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : chaque job élargit si besoin.
permissions:
  contents: read

env:
  # Les versions d'outils sont volontairement en `latest` au démarrage du
  # projet. À figer (ex: @v2.6.0) dès la première release pour la
  # reproductibilité des builds.
  GOLANGCI_VERSION: latest
  ARCHGO_VERSION: latest
  GOOSE_VERSION: latest

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Convention de commit — le titre de PR devient le message du squash
  #    commit, donc c'est LUI qui doit être conventionnel (pas chaque commit
  #    de la branche).
  # ───────────────────────────────────────────────────────────────────────────
  pr-title:
    name: Titre de PR conventionnel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifie le format Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .{1,80}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error::Titre de PR non conforme : « $TITLE »"
            echo ""
            echo "Format attendu : <type>(<scope>)!: <description>"
            echo "Types          : feat fix docs style refactor perf test build ci chore revert"
            echo "Exemples       :"
            echo "  feat(user_registration): ajoute la vérification d'unicité d'email"
            echo "  fix(outbox): évite le double envoi en cas de crash du worker"
            echo "  refactor(pkg/result)!: Map devient une fonction libre"
            exit 1
          fi
          echo "OK : $TITLE"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Qualité statique
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Format, vet & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy est-il à jour ?
        run: |
          go mod tidy
          git diff --exit-code --name-only go.mod go.sum \
            || { echo "::error::go.mod/go.sum non à jour — lance 'task fmt'"; exit 1; }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}
          golangci-lint run --timeout=5m ./...

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Zones à haute inertie — remplace un fichier CODEOWNERS, qui coderait
  #    des personnes plutôt que des règles. Toucher au règlement, aux
  #    primitives ou aux migrations exige une trace écrite dans le même diff.
  # ───────────────────────────────────────────────────────────────────────────
  inertia:
    name: Zones à haute inertie
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Moindre privilège, et surtout : la dépendance devient VISIBLE. Le garde
    # relit l'état des labels par l'API — sans ce droit il retomberait
    # silencieusement sur la seule exigence d'ADR, et l'échappatoire cesserait
    # de fonctionner sans que rien ne le dise.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # UNE seule définition, comme pour les autres gardes : le script. La
      # version en ligne lisait les labels dans la charge de l'événement, FIGÉE
      # au déclenchement — un label posé après l'échec y était invisible, et une
      # relance rejouait la même charge. Or poser le label après avoir vu
      # l'échec est la seule façon dont on s'en sert.
      - name: Un changement de règle exige un ADR dans la même PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./tools/verifie-inertie.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Ce garde-là sait échouer
        run: ./tools/verifie-inertie.sh --temoin

      # UNE seule définition, partagée avec `task ci:inertia` : le script. Le
      # motif n'est écrit NULLE PART ici — la version précédente le portait en
      # clair, donc toute PR touchant à ce job se faisait signaler par lui.
      - name: Aucune mention d'outillage d'assistance dans le diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./tools/verifie-mention-outillage.sh "$BASE" "$HEAD"

      # ADR 013 : un garde est livré avec le cas qui le fait échouer. Sans cette
      # moitié, « aucune mention détectée » et « le motif ne reconnaît plus
      # rien » rendent exactement la même sortie.
      - name: Ce garde-là sait échouer
        run: ./tools/verifie-mention-outillage.sh --temoin

      - name: Aucune dette dissimulée
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # rules/interdictions.md § Dette : ce qui n'est pas fait s'annonce
          # hors périmètre dans la PR, pas en marqueur dans le code.
          added=$(git diff "$BASE" "$HEAD" -- '*.go' '*.sql' '*.yml' '*.yaml' | grep -E '^\+' || true)
          if echo "$added" | grep -Enq '(TODO|FIXME|XXX|HACK)'; then
            echo "$added" | grep -En '(TODO|FIXME|XXX|HACK)' | sed 's/^/  /'
            echo "::error::marqueur de dette introduit — annoncer le hors périmètre dans le corps de la PR"
            exit 1
          fi
          echo "Aucun marqueur de dette."

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Guardrails d'architecture — le job le plus important du pipeline.
  #    Il échoue si quelqu'un importe l'infrastructure depuis le domaine.
  # ───────────────────────────────────────────────────────────────────────────
  architecture:
    name: Guardrails d'architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: arch-go
        run: |
          go install github.com/arch-go/arch-go@${ARCHGO_VERSION}
          arch-go --verbose

      # ── Isolation des données par module (ADR 011) ──────────────────────────
      # Un module ne doit JAMAIS toucher la zone exclusive d'un autre. Chaque
      # module possède un schéma Postgres ; les migrations d'un module ne
      # référencent que son schéma et le schéma partagé `platform`.
      # Le garde vit dans UN script, appelé ici comme par `task ci:schemas`.
      # Sa version précédente était inline et rendait NEUF faux positifs : son
      # motif s'appliquait au fichier entier, commentaires compris, et accusait
      # de la prose d'être un schéma étranger. Le job ne pouvait pas être vert.
      - name: Isolation des schémas Postgres
        run: ./tools/verifie-isolation-schemas.sh

      # ADR 013 : un garde est livré avec le cas qui le fait échouer. Sans cette
      # étape, un script devenu muet — chemin faux, dossier vide, motif cassé —
      # rendrait 0 et le job passerait au vert sans rien vérifier.
      - name: Le garde d'isolation sait échouer
        run: |
          if ./tools/verifie-isolation-schemas.sh \
               tools/testdata/isolation-violation internal/modules >/dev/null 2>&1; then
            echo "::error::le témoin de violation est passé — le garde ne garde plus"
            exit 1
          fi
          echo "refus confirmé sur tools/testdata/isolation-violation"

      # ── Hygiène des déclarations de build (#66) ─────────────────────────────
      # Deux propriétés que rien ne tenait, et dont la violation ne produit
      # AUCUN message : la version de Go déclarée à trois endroits, et
      # l'encodage des fichiers suivis.
      - name: Version de Go cohérente aux trois déclarations
        run: ./tools/verifie-version-de-go.sh

      - name: Ce garde-là sait échouer
        run: |
          t=tools/testdata/version-de-go-divergente
          if ./tools/verifie-version-de-go.sh \
               "$t/go.mod.temoin" "$t/Dockerfile.temoin" "$t/Containerfile.temoin" \
               >/dev/null 2>&1; then
            echo "::error::le témoin de divergence est passé — le garde ne garde plus"
            exit 1
          fi
          echo "refus confirmé sur $t"

      - name: Encodage — ni BOM, ni accent doublement encodé
        run: ./tools/verifie-encodage.sh

      - name: Celui-là aussi sait échouer
        run: ./tools/verifie-encodage.sh --temoin

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Tests unitaires — le cœur est pur, donc aucun service n'est requis.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # -coverpkg=./... est INDISPENSABLE : les tests sont en BOÎTE NOIRE, dans
      # `{paquet}/tests/`, donc dans un paquet different du code qu'ils exercent.
      # Sans lui, le profil n'attribue la couverture qu'au paquet de test et le
      # total tombe a 3,6 % au lieu de 52 %. Le cliquet ci-dessous echouerait
      # alors pour une raison fausse, et quelqu'un finirait par baisser le seuil.
      - name: go test -race
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...

      # Les trois cliquets sont appliqués par `tools/covergate`, le MÊME
      # programme que `task test` lance en local. Ce qui était ici en shell
      # dupliquait la logique et, surtout, mesurait mal :
      #
      #  - le seuil global de 70 % portait sur un profil produit SANS TAG, donc
      #    incapable par construction d'exécuter une ligne de pilote Postgres ou
      #    Redis. Il était inatteignable, et un seuil inatteignable finit
      #    toujours par être abaissé « pour débloquer la CI » ;
      #  - la couverture du cœur moyennait les pourcentages PAR FONCTION : une
      #    fonction d'une instruction pesait autant qu'une fonction de
      #    cinquante. Elle est désormais pondérée par instruction.
      #
      # Le seuil de 70 % n'a PAS été abaissé : il s'applique au périmètre que ce
      # lot peut atteindre. Ce qui en sort est énuméré, motivé, affiché à chaque
      # exécution, et un cliquet distinct garde le total du code produit — donc
      # ajouter du code non couvert échoue toujours. Voir #37.
      - name: Cliquets de couverture
        shell: bash
        run: |
          # `set -o pipefail` est OBLIGATOIRE ici : le shell par défaut des
          # étapes `run` est `bash -e`, SANS pipefail. Sans cette ligne, le code
          # de retour du cliquet serait celui de `tee` — toujours 0 — et la CI
          # serait verte sur une couverture insuffisante. C'est précisément le
          # faux vert que cette étape est censée empêcher.
          set -o pipefail
          {
            echo '### Couverture'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          go run ./tools/covergate coverage.out | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Migrations : les appliquer, VÉRIFIER l'isolation, puis prouver le Down.
  #
  # C'est le seul endroit du projet où une base existe (friction F001). Sans ce
  # job, `migrations/` serait du SQL écrit que personne n'a jamais exécuté.
  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migrations & isolation des données
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexa -d hexa"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      # ⚠️ DB_MIGRATION_DSN désigne `hexa_migrator`, PAS le superutilisateur.
      #
      # Ce job posait `hexa:hexa` pour les deux, donc il migrait en tant
      # qu'administrateur du conteneur. Conséquence : le rôle de migration et
      # toute sa chaîne de privilèges n'étaient exercés NULLE PART — ni en CI, ni
      # en local, ni au niveau `integration`. Ils étaient cassés depuis toujours,
      # et rien ne pouvait le dire (issue #84).
      #
      # Ce job emprunte désormais exactement le chemin d'un poste neuf :
      # provision → mots de passe → migration sous `hexa_migrator`.
      APP_ENV: test
      DB_SUPERUSER_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      DB_MIGRATION_DSN: postgres://hexa_migrator:migration-ci@localhost:5432/hexa?sslmode=disable
      DB_DSN: postgres://hexa_app:applicatif-ci@localhost:5432/hexa?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Installe goose et le client psql
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Provisionne les rôles
        run: psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/provision.sql

      # `provision.sql` ne pose aucun mot de passe, et c'est la décision. Cette
      # étape est celle qui manquait entre le provisionnement et la migration.
      - name: Pose les mots de passe des rôles de connexion
        run: ./tools/pose-mots-de-passe-locaux.sh

      # Le refus se CONSTATE : sans lui, rien ne distingue « refuse hors
      # développement » de « n'a jamais été essayé » (ADR 013).
      - name: Le poseur de mots de passe refuse hors development/test
        run: ./tools/pose-mots-de-passe-locaux.sh --temoin

      - name: Applique les migrations
        run: goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up

      - name: Vérifie les invariants d'isolation (ADR 011)
        run: psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/verify.sql

      # Un Down faux est PIRE que pas de Down : il donne une fausse assurance au
      # moment précis où l'on en a besoin, c'est-à-dire pendant un incident. La
      # seule façon de savoir qu'il fonctionne est de l'exécuter.
      - name: Prouve le retour arrière, puis rejoue
        run: |
          goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" down
          goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up
          psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/verify.sql

      # Le rôle applicatif ne doit PAS pouvoir faire de DDL. On le prouve en
      # essayant : la commande doit échouer. Un test qui vérifie qu'une chose est
      # interdite doit constater le refus, pas l'absence de tentative.
      #
      # ⚠️ Sous DB_SUPERUSER_DSN, et c'est le point délicat. `hexa_migrator`
      # n'est pas membre de `hexa_platform` : son `SET ROLE` serait refusé, psql
      # rendrait un code non nul, et ce test conclurait « refus confirmé » sans
      # avoir tenté la moindre écriture. Le durcissement de #84 aurait donc
      # SILENCIEUSEMENT vidé les deux gardes qui suivent.
      #
      # D'où la première commande : le `SET ROLE` doit RÉUSSIR seul, sinon
      # l'échec du second ne prouve rien.
      - name: Le rôle applicatif ne peut pas créer de table
        run: |
          psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q -c "SET ROLE hexa_platform;"
          if psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q \
               -c "SET ROLE hexa_platform; CREATE TABLE platform.intrus (x int);" 2>/dev/null; then
            echo "::error::hexa_platform a pu créer une table — ADR 011 §4 est violée"
            exit 1
          fi
          echo "refus confirmé : le rôle applicatif n'a pas le DDL"

      # Même logique pour l'inaltérabilité du journal d'audit.
      - name: Le journal d'audit refuse UPDATE et DELETE
        run: |
          psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO platform.audit_log (actor, action, entity_type, entity_id, occurred_at)
             VALUES ('ci', 'test.executed', 'ci_run', '1', now());"
          for sql in "UPDATE platform.audit_log SET actor = 'falsifie'" \
                     "DELETE FROM platform.audit_log"; do
            if psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q \
                 -c "SET ROLE hexa_platform; $sql;" 2>/dev/null; then
              echo "::error::le journal d'audit a accepté « $sql » — ADR 011 §5 est violée"
              exit 1
            fi
          done
          echo "refus confirmé : le journal d'audit est en ajout seul"

      # Le rôle de migration est bien `hexa_migrator`, et il endosse `hexa_owner`.
      # Sans ce constat, rien ne distinguerait ce job d'un job qui migre encore
      # sous le superutilisateur — c'est-à-dire de l'état qu'on vient de corriger.
      - name: Le chemin du rôle de migration est celui d'un poste neuf
        run: |
          observe=$(psql "$DB_MIGRATION_DSN" -tAX -c "SELECT session_user || '/' || current_user;")
          echo "session_user/current_user = $observe"
          if [ "$observe" != "hexa_migrator/hexa_owner" ]; then
            echo "::error::migration attendue sous hexa_migrator endossant hexa_owner, obtenu $observe"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # 5b. Le générateur — un projet GÉNÉRÉ passe la même barrière que le socle.
  #
  #     C'est la seule garantie qui compte pour `hexa new` (#17). Tout le reste
  #     — il compile, il écrit des fichiers — se voit en le regardant tourner.
  #
  #     Ce job a trouvé, à sa première exécution, que `tools/covergate` portait
  #     le nom du socle EN DUR : dans un projet généré, aucune exclusion ne
  #     correspondait plus, et les cliquets mesuraient un périmètre qui n'était
  #     pas le leur. Ni `task rename` ni son garde ne pouvaient le voir — ils
  #     cherchent le chemin de module COMPLET, la constante n'en portait que le
  #     dernier segment.
  # ───────────────────────────────────────────────────────────────────────────
  generator:
    name: Le projet généré passe la barrière
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Outillage
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}
          go install github.com/arch-go/arch-go@${ARCHGO_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: hexa new, hexa make:feature, puis task check DANS le projet généré
        run: |
          set -euo pipefail
          bac=$(mktemp -d)
          go build -o "$bac/hexa" ./cmd/hexa
          "$bac/hexa" new "$bac/projet" --module github.com/exemple/projet-genere
          "$bac/hexa" make:feature order_tracking --dans "$bac/projet"

          # ⚠️ La règle d'étanchéité d'arch-go NOMME chaque module en dur. Un
          # module créé sans elle n'est couvert par AUCUNE règle : il pourrait
          # importer n'importe quel autre module, et l'outil afficherait « 100 %
          # de conformité » — parce qu'il n'a rien à dire sur un module dont
          # personne ne lui a parlé.
          #
          # C'est ce constat, et lui seul, qui distingue « gardé » de « jamais
          # rencontré ». Sans lui, ce job resterait vert le jour où le générateur
          # cesserait d'écrire la règle.
          grep -q 'internal.modules.order_tracking' "$bac/projet/arch-go.yml" || {
            echo "::error::le module généré n'a pas de règle d'étanchéité — il serait hors garde"
            exit 1
          }

          cp .env.example "$bac/projet/.env"
          cd "$bac/projet"
          task check

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Niveau `integration` — les PILOTES contre les services réels (#37).
  #
  #    Huit paquets de pilotes avaient zéro test, à aucun niveau. Le tag
  #    `integration` n'était porté par AUCUN fichier, et ce job n'existait pas :
  #    la dette était nommée, jamais payée.
  #
  #    Ce niveau garde ce qu'aucun test unitaire ne peut atteindre — la validité
  #    du SQL, l'effet réel des contraintes, et les garanties de CONCURRENCE.
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: Tests d'intégration (pilotes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexa -d hexa"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      APP_ENV: test
      DB_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      DB_MIGRATION_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Les rôles d'abord, le schéma ensuite : ces tests écrivent dans les vraies
      # tables, donc elles doivent exister avec leurs vraies contraintes. C'est
      # même tout l'intérêt — c'est une contrainte `NOT NULL` qui a fait tomber
      # le pilote d'outbox à la première exécution de ce job.
      - name: Provision et migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/provision.sql
          goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up

      - name: go test -tags=integration
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -v -timeout=5m ./tests/integration/... \
            > integration.log 2>&1 && code=0 || code=$?
          grep -E '^(--- PASS|--- FAIL|ok|FAIL)' integration.log | sed 's/^/  /' || true

          # Le piège que ce dépôt a déjà payé avec `e2e` : sans le tag, zéro test
          # compile et `ok` s'affiche. Un compte nul doit ÉCHOUER, pas passer.
          runs=$(grep -c '^=== RUN' integration.log || true)
          echo "tests réellement exécutés : $runs"
          if [ "$runs" -eq 0 ]; then
            echo "::error::FAUX VERT — aucun test d'intégration exécuté"
            cat integration.log
            exit 1
          fi
          exit "$code"

      - name: Journal en cas d'échec
        if: failure()
        run: cat integration.log || true

  # 6. Tests end-to-end contre la vraie stack (Postgres + Redis + SMTP).
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hexa
          POSTGRES_PASSWORD: hexa
          POSTGRES_DB: hexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hexa -d hexa"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports: ["1025:1025", "8025:8025"]

    env:
      APP_ENV: test
      DB_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      # ⚠️ Sous APP_ENV=test, c'est TEST_DB_DSN qui décide, pas DB_DSN :
      # `config/env/test.yaml` remplace le DSN par
      # `${TEST_DB_DSN:-…/hexa_test…}`. Sans cette variable, le binaire cherche
      # une base `hexa_test` que ce job ne crée jamais.
      #
      # L'écart existait depuis toujours et ne coûtait rien : AUCUN binaire
      # n'ouvrait de connexion (#103), donc le DSN n'était jamais lu. Il l'est
      # maintenant, et le premier démarrage réel du dépileur l'a révélé.
      TEST_DB_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      # En CI les deux DSN coïncident : `hexa` est administrateur de sa base. La
      # configuration l'autorise en local et en test, et le REFUSE en UAT comme
      # en production (rules/donnees-et-migrations.md §6).
      DB_MIGRATION_DSN: postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable
      REDIS_ADDR: localhost:6379
      SMTP_ADDR: localhost:1025
      SMTP_FROM: no-reply@hexa.test
      OTEL_ENABLED: "false"
      HTTP_PORT: "8080"
      E2E_BASE_URL: http://localhost:8080
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # La cle etait FIGEE dans le bloc `env` ci-dessus. Manifestement fausse —
      # 32 octets de `0123456789abcdef` repete — donc conforme a
      # rules/securite.md §3, mais gitleaks la classe en `generic-api-key` par
      # entropie et faisait rougir le job « Fuite de secrets ». Personne ne
      # pouvait le savoir : aucun job n'avait jamais demarre (#47).
      #
      # La generer ici SUPPRIME le probleme au lieu de le declarer acceptable.
      # Une liste d'exception aurait grossi, et le garde aurait cesse de garder.
      # Elle ne chiffre que des donnees creees et detruites dans ce meme job.
      - name: Cle de chiffrement ephemere
        run: echo "SECURITY_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@${GOOSE_VERSION}
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/provision.sql
          goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up

      # ⚠️ L'ORDRE de ces étapes est la décision, et il a déjà été faux une fois.
      #
      # Le refus se vérifie sur la configuration LIVRÉE, donc avant toute
      # bascule. L'API démarre ENSUITE, une fois l'outbox basculée sur
      # `postgres` — sinon le serveur écrit dans un magasin en mémoire pendant
      # que le dépileur interroge Postgres, et ce dernier dépile un magasin vide.
      #
      # C'est très exactement le scénario que le refus ci-dessous existe pour
      # empêcher, reproduit par un mauvais séquencement du job lui-même.
      #
      # Le dépileur n'est PAS lancé ici, et ce n'est pas un oubli : la
      # configuration livrée met l'outbox sur le pilote `memory`, qui vit dans le
      # processus. Le worker refuse alors de démarrer, délibérément — il
      # dépilerait un magasin que le serveur ne partage pas.
      #
      # On vérifie donc que le refus SE PRODUIT, plutôt que de lancer un binaire
      # dont on sait qu'il s'arrêtera. Un job qui démarre un processus condamné
      # et n'en tient pas compte finit par masquer une vraie panne.
      - name: Le dépileur refuse une outbox non partagée
        run: |
          go build -o bin/worker ./cmd/worker
          if ./bin/worker > worker.log 2>&1; then
            echo '::error::le worker a démarré sur une outbox memory : il dépilerait un magasin vide'
            cat worker.log; exit 1
          fi
          grep -q "non partagé entre processus" worker.log || {
            echo "::error::le worker a échoué, mais pas pour la bonne raison"; cat worker.log; exit 1; }
          echo "refus confirmé, avec son motif"

      # Le chemin NOMINAL du dépileur, celui qui n'avait JAMAIS tourné (#103).
      #
      # Jusqu'ici ce job ne vérifiait que le refus ci-dessus. C'était une bonne
      # garde, et il en résultait que le seul chemin jamais exercé était celui de
      # l'échec : `cmd/worker` n'a démarré pour la première fois qu'après #103.
      #
      # `config/local.yaml` est la couche appliquée en dernier et non versionnée
      # (.gitignore) : elle bascule l'outbox sur `postgres` SANS toucher la
      # configuration livrée, qui doit rester démarrable sans aucune base.
      - name: Bascule l'outbox sur un pilote PARTAGÉ
        run: |
          # `notification` est désactivée par défaut ET dans la couche `test` :
          # son seul pilote écrit dans un journal sans rien envoyer. Ce job
          # l'active EXPLICITEMENT, parce que c'est ce qu'il vient exercer —
          # activer par défaut ferait croire ailleurs que les courriels partent.
          cat > config/local.yaml <<'YAML'
          telemetry:
            # `config/env/test.yaml` met le niveau à `warn` : sans cette ligne,
            # aucune des traces que ce job observe n'est écrite, et les greps
            # ci-dessous échoueraient sur un dépileur pourtant sain.
            log_level: info
          modules:
            outbox:
              driver: postgres
            notification:
              enabled: true
              driver: log
          YAML

      - name: Démarre l'API sur l'outbox partagée
        run: |
          go build -o bin/server ./cmd/server
          ./bin/server > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS "$E2E_BASE_URL/healthz" > /dev/null 2>&1; then
              echo "API prête après ${i} tentative(s)"; exit 0
            fi
            sleep 0.5
          done
          echo "::error::l'API n'a pas démarré"; cat server.log; exit 1

      - name: Le dépileur démarre sur une outbox PARTAGÉE
        run: |
          ./bin/worker > worker-nominal.log 2>&1 &
          echo $! > worker.pid
          for i in $(seq 1 30); do
            grep -q "dépilage en cours" worker-nominal.log && break
            sleep 0.5
          done
          if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
            echo "::error::le dépileur s'est arrêté au démarrage"; cat worker-nominal.log; exit 1
          fi
          grep -q "abonnement monté" worker-nominal.log || {
            echo "::error::aucun abonnement monté : les événements ne seraient consommés par personne"
            cat worker-nominal.log; exit 1; }
          echo "dépileur en marche, abonnement monté"

      # `-v` puis comptage des `=== RUN` : sans tag, ce paquet compile ZÉRO test
      # et `go test` affiche `ok`. Vérifier le code de retour ne suffit donc pas —
      # c'est le piège du faux vert documenté dans CLAUDE.md, et il a déjà eu
      # cours ici : `tests/e2e/` est resté vide pendant toute la phase 0 pendant
      # que ce job affichait vert.
      - name: go test -tags=e2e
        run: |
          go test -tags=e2e -count=1 -v -timeout=5m ./tests/e2e/... 2>&1 | tee e2e.log
          ran=$(grep -c '^=== RUN' e2e.log || true)
          echo "tests e2e exécutés : ${ran}"
          if [ "$ran" -eq 0 ]; then
            echo "::error::aucun test e2e n'a été exécuté — sortie verte, couverture nulle"
            exit 1
          fi

      # La CHAÎNE, de bout en bout : l'inscription faite par les tests e2e
      # ci-dessus doit avoir produit un effet chez le consommateur.
      #
      # Sans cette étape, tout ce qui précède resterait vert avec un consommateur
      # débranché : le dépileur marquerait les messages publiés, l'outbox se
      # viderait, et aucun effet n'aurait lieu. Un dépileur qui publie vers
      # personne ressemble EN TOUT POINT à un dépileur qui fonctionne.
      - name: L'événement a produit son effet
        run: |
          for i in $(seq 1 40); do
            grep -q 'msg=notification\|"msg":"notification"' worker-nominal.log && break
            sleep 0.5
          done
          grep -q 'msg=notification\|"msg":"notification"' worker-nominal.log || {
            echo "::error::aucune notification : la chaîne inscription → outbox → relais → notification est coupée"
            cat worker-nominal.log; exit 1; }

          # L'adresse ne doit JAMAIS sortir en clair dans un journal.
          #
          # On cherche le DOMAINE que les tests e2e utilisent — `@example.test` —
          # plutôt qu'un motif de champ : le journal est tantôt en texte
          # (`to=…`), tantôt en JSON (`"to":"…"`), et un garde indexé sur la
          # forme du champ ne pourrait pas échouer dans l'autre. Un garde
          # incapable d'échouer ressemble en tout point à un garde satisfait.
          #
          # La forme masquée écrit `e***@example.test` : le domaine y figure
          # délibérément — il sert au diagnostic et n'identifie personne — donc
          # c'est bien la partie LOCALE qu'on cherche, jamais réduite à `***`.
          if grep -qE '[a-z0-9]{2,}[^*]*@example\.test' worker-nominal.log; then
            echo "::error::une adresse en clair figure dans le journal du dépileur"
            grep -E '[a-z0-9]{2,}[^*]*@example\.test' worker-nominal.log; exit 1
          fi
          echo "chaîne complète confirmée, adresse masquée"

      - name: Logs des services (en cas d'échec)
        if: failure()
        run: |
          echo "── server.log ──"; cat server.log || true
          echo "── worker.log ──"; cat worker.log || true
          echo "── worker-nominal.log ──"; cat worker-nominal.log || true

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Compilation multi-plateforme
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/...

  # ───────────────────────────────────────────────────────────────────────────
  # 7. Sécurité des dépendances
  # ───────────────────────────────────────────────────────────────────────────
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ───────────────────────────────────────────────────────────────────────────
  # 8. Secrets — un secret poussé par erreur doit être ROTÉ, pas seulement
  #    retiré du diff. Cette garde évite d'avoir à le découvrir plus tard.
  # ───────────────────────────────────────────────────────────────────────────
  secrets:
    name: Fuite de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : un secret retiré au commit suivant reste dans
          # l'historique, donc reste compromis.
          fetch-depth: 0

      # Le BINAIRE, pas l'action : sur une `pull_request`, `gitleaks-action@v2`
      # interroge l'API GitHub, se fait refuser par `contents: read` et meurt
      # AVANT d'avoir analysé un seul fichier (#67). Le job était vert sur
      # `push`, où l'autre chemin n'appelle pas l'API — et aucune PR n'avait
      # jamais déclenché la CI (#64). Le seul chemin cassé était le seul jamais
      # exercé.
      #
      # Version épinglée : `latest` rendrait ce job irreproductible (F004).
      - name: Installe gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL "$url/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # UNE seule définition, partagée avec `task ci:secrets`.
      - name: gitleaks
        run: ./tools/verifie-fuite-de-secrets.sh

      # ADR 013 : sans cette moitié, « aucune fuite » et « le scanner n'a pas
      # tourné » rendent exactement la même sortie. C'est très précisément ce
      # qui vient d'arriver.
      - name: Ce garde-là sait échouer
        run: ./tools/verifie-fuite-de-secrets.sh --temoin

  # ───────────────────────────────────────────────────────────────────────────
  # 9. Image conteneur — construite sur chaque PR, poussée sur main seulement.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Image ${{ matrix.cmd }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cmd: [server, worker]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.cmd }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}

  # ───────────────────────────────────────────────────────────────────────────
  # 10. Portail unique — c'est CE job qu'on met en « required status check »
  #    dans le ruleset. Ajouter un job ci-dessus ne demande plus de toucher
  #    aux réglages GitHub : il suffit de l'ajouter à `needs`.
  # ───────────────────────────────────────────────────────────────────────────
  gate:
    name: CI
    if: always()
    needs: [pr-title, inertia, quality, architecture, test, migrations, integration, generator, e2e, build, vuln, secrets, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs requis ont-ils réussi ?
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Résultats : $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::un job requis a échoué ($r)"; exit 1 ;;
            esac
          done
          echo "CI verte."

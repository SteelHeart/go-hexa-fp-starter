name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex: v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  binaries:
    name: Binaires ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          for cmd in server worker; do
            go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/${cmd}-${SUFFIX}${{ matrix.ext }}" \
              "./cmd/${cmd}"
          done
          cd dist && sha256sum * > "checksums-${SUFFIX}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  publish:
    name: Publie la release
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Notes de version (depuis les titres de PR squashés)
        id: notes
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || true)
          {
            echo "notes<<__EOF__"
            if [ -n "$PREV" ]; then
              echo "## Changements depuis $PREV"
              git log --no-merges --pretty='- %s' "${PREV}..HEAD"
            else
              echo "## Première release"
              git log --no-merges --pretty='- %s'
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Crée la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${{ steps.notes.outputs.notes }}" \
            artifacts/*

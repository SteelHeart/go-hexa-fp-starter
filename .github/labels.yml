# Labels du dépôt — fait foi. Appliquer avec `task gh:labels`.
# Documentation : documentation/process/LABELS.md

# ── type: — exactement un par issue ──────────────────────────────────────────
- name: "type:feature"
  color: "0e8a16"
  description: "Nouvelle fonctionnalité"
- name: "type:fix"
  color: "d73a4a"
  description: "Correction de bug"
- name: "type:sec"
  color: "b60205"
  description: "Correction de sécurité — accompagne toujours un sec:"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation, ADR, règlement"
- name: "type:refactor"
  color: "5319e7"
  description: "Restructuration sans changement de comportement"
- name: "type:test"
  color: "1d76db"
  description: "Tests uniquement"
- name: "type:chore"
  color: "cfd3d7"
  description: "Outillage, dépendances, CI"

# ── area: — au moins un par issue ────────────────────────────────────────────
- name: "area:core"
  color: "fbca04"
  description: "domain/ ports/ application/ — le cœur pur"
- name: "area:pkg"
  color: "e99695"
  description: "internal/pkg/ — primitives, zone à haute inertie"
- name: "area:infra"
  color: "c2e0c6"
  description: "internal/infrastructure/, config/"
- name: "area:data"
  color: "bfd4f2"
  description: "Migrations, SQL, outbox"
- name: "area:http"
  color: "d4c5f9"
  description: "Adaptateur HTTP — web et mobile"
- name: "area:cli"
  color: "d4c5f9"
  description: "Adaptateur ligne de commande"
- name: "area:events"
  color: "d4c5f9"
  description: "Consommateurs asynchrones, worker"
- name: "area:ci"
  color: "cfd3d7"
  description: "Workflows, gardes, outillage"
- name: "area:docs"
  color: "0075ca"
  description: "rules/, documentation/"

# ── sec: — sévérité, sur toute entrée du registre de sécurité ────────────────
- name: "sec:critique"
  color: "b60205"
  description: "Contournement d'authz, fuite de données, falsification de preuve"
- name: "sec:eleve"
  color: "d93f0b"
  description: "Déni de service, vol de session, dégradation d'une garde"
- name: "sec:moyen"
  color: "fbca04"
  description: "Défaut de durcissement, contrôle manquant"

# ── Marqueurs d'état ─────────────────────────────────────────────────────────
- name: "blocked"
  color: "000000"
  description: "Attend une décision ou un paramètre manquant"
- name: "needs-decision"
  color: "d876e3"
  description: "Arbitrage requis AVANT implémentation"
- name: "friction"
  color: "f9d0c4"
  description: "Trou du socle — voir documentation/process/JOURNAL_FRICTION.md"
- name: "inertia:justified"
  color: "e99695"
  description: "Zone à haute inertie sans ADR — justification dans le corps de la PR"
- name: "dependencies"
  color: "0366d6"
  description: "Mise à jour de dépendances"

# golangci-lint v2 — configuration volontairement stricte.
# Le but n'est pas d'avoir « zéro warning » mais de rendre coûteux tout écart
# aux principes du projet : pureté, immuabilité, petites fonctions, pas d'effet caché.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # ── Correction ────────────────────────────────────────────────────────────
    - errcheck # toute erreur doit être traitée
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - nilerr # ne pas retourner nil quand err != nil
    - nilnil
    - errorlint # %w, errors.Is/As
    - exhaustive # switch exhaustif sur les enums (nos ErrorCode, Status…)
    - makezero
    - durationcheck
    - contextcheck
    - noctx # pas de requête HTTP/SQL sans context
    - copyloopvar
    - protogetter

    # ── Simplicité / pureté ───────────────────────────────────────────────────
    - gocritic
    - gocognit # complexité cognitive
    - cyclop # complexité cyclomatique
    - funlen # fonctions courtes = composables
    - nestif
    - dupl # DRY : détecte le copier-coller
    - gochecknoglobals # pas d'état global mutable
    - gochecknoinits # pas de func init() magique
    - reassign # ne pas réassigner les variables de packages importés
    - unconvert
    - unparam
    - wastedassign
    - prealloc
    - predeclared
    - importas
    - depguard

    # ── Style / lisibilité ────────────────────────────────────────────────────
    - revive
    # misspell est RETIRÉ tant que le code est commenté en français.
    #
    # Il ne connaît que l'anglais : sur l'état courant, il produit 143 signalements
    # dont ZÉRO vraie faute. « marrage » (démarrage) devient « marriage »,
    # « partiel » devient « particle », « pointeur » devient « pointer ». Ces faux
    # positifs noieraient les 96 signalements réels des autres linters, et
    # apprendraient à l'équipe à parcourir la sortie sans la lire — ce qui coûte
    # plus cher que l'absence du linter.
    #
    # À réactiver dans la PR de traduction (issue #34), où il redeviendra utile.
    # - misspell
    - godot # les commentaires se terminent par un point
    - goconst
    - nakedret
    - lll
    - whitespace
    - nolintlint # tout //nolint doit être expliqué
    - testifylint
    - thelper
    - tparallel
    - usestdlibvars
    - wrapcheck # les erreurs traversant une frontière sont enveloppées

    # ── Sécurité ──────────────────────────────────────────────────────────────
    - gosec
    - errchkjson

  settings:
    cyclop:
      max-complexity: 10
      package-average: 5.0

    gocognit:
      min-complexity: 15

    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    nestif:
      min-complexity: 4

    dupl:
      threshold: 120

    lll:
      line-length: 120
      tab: "    "

    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true

    exhaustive:
      default-signifies-exhaustive: true

    errcheck:
      # Refuse `v := x.(T)`, qui PANIQUE si le type ne correspond pas. C'est la
      # forme dangereuse, et elle n'a aucune raison d'exister dans ce dépôt.
      check-type-assertions: true

      # check-blank reste à FALSE, et c'est un arbitrage, pas un oubli.
      #
      # Combiné à check-type-assertions, il condamnait `v, _ := x.(T)` — c'est-à-dire
      # la forme SÛRE de l'assertion, celle qui ne panique pas. Un linter qui
      # interdit le remède en même temps que le mal ne laisse aucune issue : il
      # pousse à écrire `//nolint` partout, et le jour où un vrai signalement
      # apparaît, personne ne le distingue des quinze contournements.
      #
      # `_ = f()` reste donc autorisé comme marqueur explicite d'un abandon
      # délibéré. Ce qui n'est pas outillé ici l'est en revue : un `_ =` sur une
      # erreur doit porter un commentaire disant pourquoi.
      check-blank: false

    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated]
      disabled-checks:
        - whyNoLint

        # hugeParam et rangeValCopy contredisent une DÉCISION D'ARCHITECTURE, pas
        # une négligence.
        #
        # Tout ce dépôt repose sur des valeurs immuables : un `domain.Message` ou un
        # `domain.User` se passe par copie, précisément pour qu'un décorateur, un
        # journal d'audit et le pipeline métier ne partagent jamais la même instance
        # modifiable. `revive` refuse d'ailleurs les récepteurs pointeurs sur ces
        # types, par la même logique.
        #
        # Les suivre reviendrait à échanger cette garantie contre l'économie d'une
        # copie de 168 octets. À cinquante messages par lot, cela représente huit
        # kilooctets — soit rien, comparé à un défaut d'aliasing qu'on diagnostique
        # en trois jours.
        #
        # Le jour où un profilage montrera que ces copies coûtent, la décision se
        # rediscutera sur des chiffres. Pas avant.
        - hugeParam
        - rangeValCopy

    govet:
      enable-all: true
      disable:
        - fieldalignment # lisibilité > packing mémoire pour nos value objects

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      severity: error
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: context-as-argument
        - name: context-keys-type
        - name: confusing-naming
        - name: flag-parameter # un booléen de contrôle = deux fonctions
        - name: function-result-limit
          arguments: [3]
        - name: argument-limit
          arguments: [5]
        - name: unnecessary-stmt
        - name: modifies-value-receiver # protège l'immuabilité de nos value objects

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - huma.Error
        - huma.NewError

    depguard:
      rules:
        # GORM est interdit PARTOUT : hooks, gorm.Model, soft-delete et
        # réflexion fuient par conception jusque dans les entités.
        # Voir documentation/adr/009-strategie-d-acces-aux-donnees.md.
        no-gorm:
          list-mode: lax
          files: ["$all"]
          deny:
            - pkg: gorm.io/gorm
              desc: "Interdit partout — fuit dans le domaine. Utiliser sqlc/pgx (ADR 009)."

        # Ent et Bun sont autorisés, mais CONFINÉS aux adaptateurs secondaires.
        # `$all` moins les fichiers autorisés : depguard applique la règle aux
        # fichiers listés, on interdit donc dans tout le reste.
        orm-confine:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/modules/*/adapters/secondary/**"
            - "!**/internal/infrastructure/database/**"
          deny:
            - pkg: entgo.io/ent
              desc: "Autorisé uniquement dans adapters/secondary/ (ADR 009)."
            - pkg: github.com/uptrace/bun
              desc: "Autorisé uniquement dans adapters/secondary/ (ADR 009)."
            - pkg: github.com/Masterminds/squirrel
              desc: "Autorisé uniquement dans adapters/secondary/ (ADR 009)."
        # Le domaine et les ports restent purs : ni transport, ni driver, ni horloge.
        # Une seule anatomie (ADR 012) : la même exigence vaut pour un module
        # noyau et pour un module métier. Les pilotes, eux, sont libres — c'est
        # tout leur rôle.
        pure-core:
          list-mode: lax
          files:
            - "**/internal/modules/*/domain/**"
            - "**/internal/modules/*/ports/**"
            - "**/internal/core/*/domain/**"
            - "**/internal/core/*/ports/**"
          deny:
            - pkg: net/http
              desc: "Le cœur ne connaît pas le transport (adapters/primary uniquement)."
            - pkg: database/sql
              desc: "Le cœur ne connaît pas la persistance (adapters/secondary uniquement)."
            - pkg: github.com/jackc/pgx
              desc: "Le cœur ne connaît pas la persistance (adapters/secondary uniquement)."
            - pkg: github.com/danielgtaylor/huma
              desc: "Le cœur ne connaît pas le framework HTTP."
            - pkg: github.com/redis/go-redis
              desc: "Le cœur ne connaît pas le cache."
            - pkg: log/slog
              desc: "Le cœur ne journalise pas : il retourne. Journaliser est le rôle d'un pilote."

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Le wiring manuel est par nature long et référence tous les packages :
      # c'est le seul endroit où la composition est autorisée à être verbeuse.
      - path: 'cmd/[^/]+/main\.go'
        linters: [funlen, gocognit, cyclop, gochecknoglobals]

      # Les tests peuvent dupliquer, être longs et utiliser des fixtures globales.
      - path: '_test\.go'
        linters: [funlen, dupl, gocognit, cyclop, lll, gochecknoglobals, gosec, wrapcheck]

      # Les constructeurs de la couche pkg exposent volontairement des génériques
      # dont la signature dépasse la limite d'arguments.
      - path: 'internal/pkg/'
        linters: [ireturn]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SteelHeart/go-hexa-fp-starter
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

# Surcharges de développement local. Fusionnées par-dessus les groupes.
app:
  env: development

database:
  # En développement seulement, les deux rôles peuvent coïncider.
  dsn: ${DB_DSN:-postgres://hexa:hexa@localhost:5432/hexa?sslmode=disable}

telemetry:
  enabled: true
  log_level: debug
  log_format: text

messaging:
  driver: inproc

modules:
  # Authentification active EN LOCAL uniquement — ADR 017.
  #
  # Le seul pilote écrit est `memory` : il efface les comptes au redémarrage et
  # ne se partage pas entre répliques. L'activer par défaut ferait partir une
  # production avec une authentification qui se réinitialise à chaque
  # déploiement.
  #
  # Ici, en revanche, il rend `auth` démontrable d'un `go run` — le composition
  # root crée alors un compte d'amorçage et affiche son secret UNE fois (#99).
  auth:
    enabled: true

  # Notification active EN LOCAL uniquement.
  #
  # Le seul pilote écrit est `log` : il ÉCRIT le message et ne l'envoie à
  # personne. C'est exactement ce qu'on veut ici — la chaîne complète
  # `inscription → outbox → relais → notification` devient observable sans
  # serveur SMTP ni compte chez un fournisseur — et exactement ce qu'on ne veut
  # nulle part ailleurs, où cela ferait croire que les courriels partent.
  #
  # `body: masked` reste le défaut, y compris ici : un lien de confirmation est
  # un identifiant au porteur, et l'habitude de le voir en clair en
  # développement est celle qu'on emporte en production. Basculer sur `logged`
  # est une décision qui se prend, pas un confort qu'on hérite.
  notification:
    enabled: true

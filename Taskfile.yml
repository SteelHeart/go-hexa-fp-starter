# https://taskfile.dev — remplace Makefile (cross-platform, Windows inclus).
version: "3"

dotenv: [".env"]

vars:
  MODULE:
    sh: go list -m
  BIN: bin
  COVER_PROFILE: coverage.out
  # Aucun seuil ici, volontairement. Il y en avait un — `COVER_THRESHOLD: 80` —
  # que AUCUNE tâche ne lisait, pendant que la CI en appliquait 70 et 90. Trois
  # valeurs, trois endroits, dont un mort : la seule source de vérité est
  # désormais `tools/covergate`.

tasks:
  default:
    desc: Liste les tâches disponibles
    cmds:
      - task --list-all
    silent: true

  # ── Bootstrap ───────────────────────────────────────────────────────────────
  init:
    desc: Installe les outils de dev et prépare .env
    cmds:
      - cmd: cp .env.example .env
        platforms: [linux, darwin]
        ignore_error: true
      - cmd: powershell -NoProfile -Command "if (-not (Test-Path .env)) { Copy-Item .env.example .env }"
        platforms: [windows]
      - task: tools

  tools:
    desc: Installe l'outillage (linter, arch guardrails, migrations, vuln scan)
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/arch-go/arch-go@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  # ── Stack locale ────────────────────────────────────────────────────────────
  up:
    desc: Démarre Postgres, Redis, Jaeger, Mailpit puis applique les migrations
    cmds:
      - docker compose up -d --wait
      # Les rôles d'abord : une migration qui accorde un privilège à un rôle
      # absent échoue, et c'est le comportement voulu.
      - task: db:provision
      - task: migrate:up
      - task: db:verify

  down:
    desc: Arrête la stack locale
    cmds:
      - docker compose down

  reset:
    desc: Détruit et recrée la stack locale (volumes inclus)
    cmds:
      - docker compose down -v
      - task: up

  logs:
    desc: Suit les logs de la stack locale
    cmds:
      - docker compose logs -f

  # ── Base de données ─────────────────────────────────────────────────────────
  #
  # Les migrations tournent sous DB_MIGRATION_DSN, JAMAIS sous DB_DSN.
  #
  # Le rôle applicatif n'a ni CREATE, ni ALTER, ni DROP (ADR 011 §4) : lui faire
  # appliquer les migrations exigerait de lui donner ces droits, et toute la
  # protection tomberait. Deux DSN, deux rôles, deux pouvoirs.
  #
  # Le dossier est ./migrations/postgres et non ./migrations : postgres est un
  # pilote parmi d'autres, pas le moteur du socle (ADR 012).
  db:provision:
    desc: 'Crée les rôles SQL — UNE FOIS, avec un rôle administrateur'
    cmds:
      - psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/provision.sql

  migrate:up:
    desc: Applique les migrations
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up

  migrate:down:
    desc: Annule la dernière migration
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" down

  migrate:status:
    desc: Affiche l'état des migrations
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" status

  migrate:new:
    desc: 'Crée une migration : task migrate:new -- add_something'
    cmds:
      - goose -dir ./migrations/postgres create {{.CLI_ARGS}} sql

  db:verify:
    desc: Vérifie les invariants d'isolation de l'ADR 011
    cmds:
      - psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/verify.sql

  # ── Exécution ───────────────────────────────────────────────────────────────
  run:
    desc: Lance l'API HTTP
    cmds:
      - go run ./cmd/server

  run:worker:
    desc: Lance le worker (dépilement de l'outbox)
    cmds:
      - go run ./cmd/worker

  build:
    desc: Compile les deux binaires dans ./bin
    cmds:
      - go build -trimpath -ldflags="-s -w" -o {{.BIN}}/ ./cmd/...

  # ── Qualité ─────────────────────────────────────────────────────────────────
  check:
    desc: Barrière qualité complète (identique à la CI)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: arch
      - task: test
      - task: vuln

  fmt:
    desc: Formate le code
    cmds:
      - go fmt ./...
      - go mod tidy

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint (config ultra-stricte)
    cmds:
      - golangci-lint run ./...

  arch:
    desc: Vérifie les guardrails d'architecture (arch-go.yml)
    cmds:
      - arch-go --verbose

  vuln:
    desc: Scan de vulnérabilités des dépendances
    cmds:
      - govulncheck ./...

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    desc: 'Tests unitaires (sans -race : CGO absent sur Windows sans compilateur C)'
    cmds:
      # -coverpkg=./... est INDISPENSABLE ici, pas une option de confort.
      #
      # Les tests de ce dépôt sont en BOÎTE NOIRE : ils vivent dans `{paquet}/tests/`,
      # donc dans un paquet DIFFÉRENT du code qu'ils exercent. Sans -coverpkg, le
      # profil n'attribue la couverture qu'au paquet de test lui-même, et le total
      # tombe à 3,6 % alors que la couverture réelle est de 52 %.
      #
      # Un chiffre faux dans ce sens est le pire : il ferait échouer un cliquet de
      # couverture, puis quelqu'un baisserait le seuil pour « débloquer la CI » —
      # et le garde ne garderait plus rien.
      - go test -shuffle=on -coverprofile={{.COVER_PROFILE}} -covermode=count -coverpkg=./... ./...
      # Les cliquets sont appliqués par un PROGRAMME, pas par du shell dupliqué :
      # la CI lance exactement cette commande. Les seuils vivent à un seul
      # endroit, dans tools/covergate, et ils sont compilés.
      - go run ./tools/covergate {{.COVER_PROFILE}}

  test:race:
    desc: 'Tests + detecteur de courses (exige CGO : CI Linux)'
    cmds:
      - go test -race -shuffle=on -covermode=atomic ./...

  test:cover:
    desc: Rapport de couverture HTML
    deps: [test]
    cmds:
      - go tool cover -html={{.COVER_PROFILE}} -o coverage.html
      - go tool cover -func={{.COVER_PROFILE}} | tail -n 1

  test:e2e:
    desc: Tests end-to-end (nécessite `task up` puis `task run`)
    cmds:
      - go test -tags=e2e -count=1 -v ./tests/e2e/...

  test:perf:
    desc: Test de charge k6 (nécessite l'API démarrée)
    cmds:
      - k6 run tests/perf/registration.js

  # ── Contrat d'API ───────────────────────────────────────────────────────────
  openapi:
    desc: Régénère api/openapi.yaml depuis le code (source de vérité = les structs Go)
    cmds:
      - go run ./cmd/server --openapi > api/openapi.yaml
      - cmd: echo "api/openapi.yaml régénéré"

  # ── Maintenance ─────────────────────────────────────────────────────────────
  # Le chemin de module est la SEULE valeur nominative du dépôt. C'est cette
  # tâche qui rend le socle réutilisable — et c'est elle qu'exerceront le premier
  # transfert de propriétaire comme chaque `hexa new`.
  #
  # Elle ne se limite donc pas aux fichiers Go. Deux fichiers de configuration
  # portent le chemin, et les oublier ne casse rien tout de suite — ce qui est
  # exactement le problème :
  #
  #   .golangci.yml  `goimports.local-prefixes`. Le module renommé cesse d'être
  #                  reconnu comme local : goimports reclasse TOUS les imports du
  #                  projet en tiers et veut réordonner chaque bloc. `task fmt` et
  #                  `task lint` divergent alors sur des centaines de fichiers,
  #                  chez quelqu'un qui n'a écrit aucun d'eux.
  #
  #   Dockerfile     `org.opencontainers.image.source`. Chaque image annoncerait
  #                  la provenance du dépôt d'ORIGINE. Une provenance fausse est
  #                  un problème de chaîne d'approvisionnement, pas de cosmétique.
  #
  # La dernière étape VÉRIFIE qu'il ne reste rien. Sans elle, le prochain fichier
  # qui portera le chemin rouvrira le trou en silence, et on ne l'apprendra qu'au
  # rename suivant — c'est-à-dire chez un utilisateur.
  rename:
    desc: 'Change le module path : task rename -- github.com/moi/mon-projet'
    cmds:
      - go mod edit -module {{.CLI_ARGS}}
      - cmd: |
          git ls-files '*.go' | xargs sed -i 's|{{.MODULE}}|{{.CLI_ARGS}}|g'
          sed -i 's|{{.MODULE}}|{{.CLI_ARGS}}|g' .golangci.yml Dockerfile
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -Command "Get-ChildItem -Recurse -Filter *.go |
          ForEach-Object { (Get-Content $_.FullName -Raw) -replace
          [regex]::Escape('{{.MODULE}}'), '{{.CLI_ARGS}}' |
          Set-Content $_.FullName -NoNewline -Encoding utf8 };
          @('.golangci.yml','Dockerfile') | ForEach-Object {
          (Get-Content $_ -Raw) -replace [regex]::Escape('{{.MODULE}}'),
          '{{.CLI_ARGS}}' | Set-Content $_ -NoNewline -Encoding utf8 }"
        platforms: [windows]
      - go mod tidy
      - go build ./...
      - task: rename:verify
        vars: { FROM: '{{.MODULE}}' }

  rename:verify:
    desc: "Vérifie qu'aucune trace du chemin de module d'origine ne subsiste"
    internal: true
    cmds:
      # EXCLUSIONS DÉCLARÉES, et non oubliées : CLAUDE.md et REPRISE.md citent le
      # chemin dans des liens vers des PR HISTORIQUES. Les réécrire ferait pointer
      # l'historique du socle vers un dépôt qui ne l'a jamais porté. GitHub
      # redirige les URL d'un dépôt transféré, donc ces liens restent valides.
      #
      # Toute AUTRE occurrence est un oubli, et fait échouer la tâche.
      - cmd: |
          restant=$(git ls-files \
            | grep -v -e '^CLAUDE\.md$' -e '^documentation/process/REPRISE\.md$' \
            | xargs grep -l '{{.FROM}}' 2>/dev/null || true)
          if [ -n "$restant" ]; then
            echo "task rename : le chemin d'origine subsiste dans :" >&2
            echo "$restant" | sed 's/^/  /' >&2
            echo "" >&2
            echo "Ajouter le fichier à la tâche rename, ou l'inscrire dans les" >&2
            echo "exclusions déclarées de rename:verify — jamais le laisser passer." >&2
            exit 1
          fi
          echo "rename : aucune trace résiduelle hors exclusions déclarées."
        platforms: [linux, darwin]

  clean:
    desc: Supprime les artefacts de build
    cmds:
      - cmd: rm -rf {{.BIN}} {{.COVER_PROFILE}} coverage.html
        platforms: [linux, darwin]
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.BIN}}, {{.COVER_PROFILE}}, coverage.html"
        platforms: [windows]

# https://taskfile.dev — remplace Makefile (cross-platform, Windows inclus).
version: "3"

dotenv: [".env"]

vars:
  MODULE:
    sh: go list -m
  BIN: bin
  COVER_PROFILE: coverage.out
  # Aucun seuil ici, volontairement. Il y en avait un — `COVER_THRESHOLD: 80` —
  # que AUCUNE tâche ne lisait, pendant que la CI en appliquait 70 et 90. Trois
  # valeurs, trois endroits, dont un mort : la seule source de vérité est
  # désormais `tools/covergate`.

tasks:
  default:
    desc: Liste les tâches disponibles
    cmds:
      - task --list-all
    silent: true

  # ── Bootstrap ───────────────────────────────────────────────────────────────
  init:
    desc: Installe les outils de dev et prépare .env
    cmds:
      - cmd: cp .env.example .env
        platforms: [linux, darwin]
        ignore_error: true
      - cmd: powershell -NoProfile -Command "if (-not (Test-Path .env)) { Copy-Item .env.example .env }"
        platforms: [windows]
      - task: tools

  tools:
    desc: Installe l'outillage (linter, arch guardrails, migrations, vuln scan)
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/arch-go/arch-go@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  # ── Stack locale ────────────────────────────────────────────────────────────
  up:
    desc: Démarre Postgres, Redis, Jaeger, Mailpit puis applique les migrations
    cmds:
      - docker compose up -d --wait
      # Les rôles d'abord : une migration qui accorde un privilège à un rôle
      # absent échoue, et c'est le comportement voulu.
      - task: db:provision
      # Puis leurs mots de passe LOCAUX. `provision.sql` n'en pose aucun, à juste
      # titre — mais un rôle LOGIN sans mot de passe ne se connecte pas, et la
      # migration suivante échouait donc sur un clone neuf (#84).
      - task: db:credentials
      - task: migrate:up
      - task: db:verify

  down:
    desc: Arrête la stack locale
    cmds:
      - docker compose down

  reset:
    desc: Détruit et recrée la stack locale (volumes inclus)
    cmds:
      - docker compose down -v
      - task: up

  logs:
    desc: Suit les logs de la stack locale
    cmds:
      - docker compose logs -f

  # ── Base de données ─────────────────────────────────────────────────────────
  #
  # Les migrations tournent sous DB_MIGRATION_DSN, JAMAIS sous DB_DSN.
  #
  # Le rôle applicatif n'a ni CREATE, ni ALTER, ni DROP (ADR 011 §4) : lui faire
  # appliquer les migrations exigerait de lui donner ces droits, et toute la
  # protection tomberait. Deux DSN, deux rôles, deux pouvoirs.
  #
  # Le dossier est ./migrations/postgres et non ./migrations : postgres est un
  # pilote parmi d'autres, pas le moteur du socle (ADR 012).
  db:provision:
    desc: 'Crée les rôles SQL — UNE FOIS, avec un rôle administrateur'
    cmds:
      - psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/provision.sql

  db:credentials:
    desc: 'Pose les mots de passe locaux des rôles de connexion — development/test SEULEMENT'
    cmds:
      - ./tools/pose-mots-de-passe-locaux.sh

  db:credentials:temoin:
    desc: "Prouve que db:credentials REFUSE hors development/test (ADR 013)"
    cmds:
      - ./tools/pose-mots-de-passe-locaux.sh --temoin

  migrate:up:
    desc: Applique les migrations
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" up

  migrate:down:
    desc: Annule la dernière migration
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" down

  migrate:status:
    desc: Affiche l'état des migrations
    cmds:
      - goose -dir ./migrations/postgres postgres "$DB_MIGRATION_DSN" status

  migrate:new:
    desc: 'Crée une migration : task migrate:new -- add_something'
    cmds:
      - goose -dir ./migrations/postgres create {{.CLI_ARGS}} sql

  db:verify:
    desc: Vérifie les invariants d'isolation de l'ADR 011
    cmds:
      - psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -f deploy/postgres/verify.sql

  # ── Exécution ───────────────────────────────────────────────────────────────
  run:
    desc: Lance l'API HTTP
    cmds:
      - go run ./cmd/server

  run:worker:
    desc: Lance le worker (dépilement de l'outbox)
    cmds:
      - go run ./cmd/worker

  build:
    desc: Compile les deux binaires dans ./bin
    cmds:
      - go build -trimpath -ldflags="-s -w" -o {{.BIN}}/ ./cmd/...

  # ── Qualité ─────────────────────────────────────────────────────────────────
  check:
    desc: Barrière qualité complète (identique à la CI)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: arch
      - task: test
      - task: vuln

  # ── La barrière complète, hors GitHub ───────────────────────────────────────
  #
  # `task check` couvre 4 des 12 jobs de la CI. L'écart — migrations, e2e,
  # compilation croisée, secrets, images — est PRÉCISÉMENT là où tous les défauts
  # récents se sont logés, parce que rien ne les exécutait.
  #
  # `task ci` referme cet écart. Elle rejoue 10 jobs sur 12 dans la toolbox.
  #
  # ⚠️ CE N'EST PAS UNE GARDE. Elle s'exécute sur la machine de l'auteur, et
  # l'auteur peut ne pas la lancer. C'est un INSTRUMENT DE MESURE reproductible,
  # pas un contrôle — la même distinction que `rules/toolchain.md` §4 fait entre
  # le crochet local et le ruleset serveur. Tant que la CI ne démarre pas (#47),
  # fusionner reste une décision DOCUMENTÉE, jamais un gate franchi.
  #
  # Ce qu'elle ne couvre pas, et pourquoi :
  #   pr-title  le titre n'existe qu'au niveau de la PR — `task ci:pr-title -- "…"`
  #   inertia   exige les SHA base/head de la PR — `task ci:inertia -- <base>`
  ci:
    desc: "Rejoue hors GitHub la barrière — 12 jobs de ci.yml sur 14, plus le garde de déploiement"
    cmds:
      - task: check
      - task: ci:schemas
      - task: ci:hygiene
      - task: ci:build
      - task: ci:secrets
      - task: ci:migrations
      - task: ci:e2e
      - task: ci:integration
      - task: ci:generateur
      - task: ci:images
      - task: ci:deploiement
      - cmd: |
          echo ""
          echo "  task ci : toutes les étapes ont rendu 0."
          echo "  NON couverts : pr-title, inertia (contexte de PR) — voir task --list-all"

  ci:deploiement:
    desc: "Le garde « aucun déploiement sans CI verte » — et le cas qui le fait refuser"
    silent: true
    cmds:
      # Seule la moitié TÉMOIN est rejouable hors GitHub : l'autre interroge
      # l'API des exécutions. C'est justement la moitié qui manquait, et son
      # absence a laissé le garde annoncer « CI en échec » sur une CI verte
      # pendant des semaines (#75).
      - ./tools/attend-la-ci.sh --temoin

  ci:build:
    desc: "Compilation croisée — la matrice exacte du job build"
    cmds:
      - cmd: |
          set -e
          for pair in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${pair%/*}; arch=${pair#*/}
            printf '  build %-14s' "$pair"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "{{.BIN}}/$os-$arch/" ./cmd/...
            echo " ok"
          done

  ci:schemas:
    desc: "Isolation des schémas SQL (ADR 011) — et le cas qui fait échouer le garde"
    silent: true
    cmds:
      # UNE seule définition, partagée avec `ci.yml` : le script. Le dépôt a
      # déjà payé la divergence local/CI avec trois seuils en trois endroits.
      - cmd: |
          set -e
          echo "  sens succès — le dépôt réel :"
          ./tools/verifie-isolation-schemas.sh
          # ADR 013 : un garde est livré avec le cas qui le fait échouer. Sans
          # cette moitié, on ne distingue pas « aucune violation » de « le garde
          # ne tourne pas » — la confusion exacte qui a laissé passer huit gardes
          # défectueux dans ce dépôt.
          echo "  sens échec — le témoin :"
          if ./tools/verifie-isolation-schemas.sh tools/testdata/isolation-violation internal/modules >/dev/null 2>&1; then
            echo "  LE GARDE NE GARDE PLUS : le témoin de violation est passé" >&2
            exit 1
          fi
          echo "    refus confirmé sur tools/testdata/isolation-violation"

  ci:secrets:
    desc: "gitleaks sur l'historique complet — le job « Fuite de secrets »"
    silent: true
    cmds:
      # UNE seule définition, partagée avec `ci.yml` : le script. Il porte la
      # commande, ses motifs, et le témoin de l'ADR 013.
      - cmd: |
          set -e
          ./tools/verifie-fuite-de-secrets.sh
          echo "  sens échec — le témoin :"
          ./tools/verifie-fuite-de-secrets.sh --temoin

  ci:migrations:
    desc: "Le job « Migrations & isolation » en entier, Down et refus compris"
    cmds:
      - task: up
      # Un Down faux est PIRE que pas de Down : il rassure au moment précis où
      # l'on en a besoin. La seule façon de savoir qu'il marche est de l'exécuter.
      - task: migrate:down
      - task: migrate:up
      - task: db:verify
      # Les deux refus de l'ADR 011 se CONSTATENT. Un test qui vérifie qu'une
      # chose est interdite doit voir le refus, pas l'absence de tentative.
      #
      # ⚠️ Ces refus s'exercent sous DB_SUPERUSER_DSN, pas sous DB_MIGRATION_DSN.
      # Depuis que le rôle de migration est `hexa_migrator` et non plus un
      # superutilisateur (#84), il n'est PAS membre de `hexa_platform` : son
      # `SET ROLE` serait refusé, la commande échouerait, et le test conclurait
      # « refus confirmé » sans avoir jamais tenté la moindre écriture.
      # Un faux vert, et de la pire espèce : celui qui grandit avec le durcissement.
      - cmd: |
          set -e
          # Le SET ROLE doit d'abord RÉUSSIR, sinon l'échec suivant ne prouve rien.
          psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q -c "SET ROLE hexa_platform;"
          if psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q \
               -c "SET ROLE hexa_platform; CREATE TABLE platform.intrus (x int);" 2>/dev/null; then
            echo "  ADR 011 violée : le rôle applicatif a pu créer une table" >&2; exit 1
          fi
          echo "  refus confirmé : pas de DDL pour le rôle applicatif"
          psql "$DB_MIGRATION_DSN" -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO platform.audit_log (actor, action, entity_type, entity_id, occurred_at)
             VALUES ('ci-local', 'test.executed', 'run', '1', now());"
          for sql in "UPDATE platform.audit_log SET actor = 'falsifie'" "DELETE FROM platform.audit_log"; do
            if psql "$DB_SUPERUSER_DSN" -v ON_ERROR_STOP=1 -q \
                 -c "SET ROLE hexa_platform; $sql;" 2>/dev/null; then
              echo "  ADR 011 violée : le journal d'audit a accepté « $sql »" >&2; exit 1
            fi
          done
          echo "  refus confirmé : journal d'audit en ajout seul"
      - task: db:credentials:temoin

  ci:integration:
    desc: "Le niveau `integration` — les pilotes contre les SERVICES REELS (#37)"
    cmds:
      - task: up
      - cmd: |
          set -e
          go test -tags=integration -count=1 -v -timeout=5m ./tests/integration/... \
            > /tmp/hexa-integration.log 2>&1
          code=$?
          # Le meme piege que pour e2e : sans le tag, zero test compile et `ok`
          # s'affiche. Un compte nul doit echouer, pas passer.
          runs=$(grep -c '^=== RUN' /tmp/hexa-integration.log || true)
          grep -E '^(--- PASS|--- FAIL|ok|FAIL)' /tmp/hexa-integration.log | sed 's/^/  /'
          echo "  tests réellement exécutés : $runs"
          if [ "$runs" -eq 0 ]; then
            echo "  FAUX VERT : aucun test d'intégration exécuté" >&2; exit 1
          fi
          exit $code

  ci:e2e:
    desc: "Le job e2e — serveur démarré, tag e2e, et les tests COMPTÉS"
    env:
      E2E_BASE_URL: http://localhost:8080
    cmds:
      - cmd: |
          set -e
          # Le port est-il libre ? Sans ce contrôle, un autre service déjà à
          # l'écoute répond à la place du serveur, et le message d'échec accuse
          # « le serveur n'a pas démarré » — alors qu'il n'a pas pu se LIER.
          # Diagnostiqué à la main une fois : un conteneur WordPress d'un autre
          # projet tenait le 8080, et rendait un 404 très convaincant.
          if curl -fsS -o /dev/null --max-time 2 "$E2E_BASE_URL/healthz" 2>/dev/null; then
            echo "  un serveur répond DÉJÀ sur $E2E_BASE_URL — arrêter l'autre" >&2
            echo "  instance avant de relancer." >&2
            exit 1
          fi
          if curl -sS -o /dev/null --max-time 2 "$E2E_BASE_URL/" 2>/dev/null; then
            echo "  le port 8080 est OCCUPÉ par un autre service : il répond, mais pas" >&2
            echo "  sur /healthz. Libérer le port avant de relancer." >&2
            exit 1
          fi
          go run ./cmd/server > /tmp/hexa-e2e-server.log 2>&1 &
          srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          if ! curl --retry 60 --retry-delay 1 --retry-connrefused -fsS "$E2E_BASE_URL/healthz" >/dev/null; then
            echo "  le serveur n'a pas démarré :" >&2; cat /tmp/hexa-e2e-server.log >&2; exit 1
          fi
          go test -tags=e2e -count=1 -v -timeout=5m ./tests/e2e/... > /tmp/hexa-e2e.log 2>&1
          code=$?
          # LE piège de ce dépôt : sans le tag, zéro test compile et `ok` s'affiche.
          # Un compte nul doit donc échouer, pas passer.
          runs=$(grep -c '^=== RUN' /tmp/hexa-e2e.log || true)
          grep -E '^(--- PASS|--- FAIL|ok|FAIL)' /tmp/hexa-e2e.log | sed 's/^/  /'
          echo "  tests réellement exécutés : $runs"
          if [ "$runs" -eq 0 ]; then
            echo "  FAUX VERT : aucun test e2e exécuté" >&2; exit 1
          fi
          exit $code

  ci:hygiene:
    desc: "Version de Go cohérente et encodage sain — et les cas qui font échouer"
    silent: true
    cmds:
      # UNE seule définition, partagée avec `ci.yml` : les scripts.
      - cmd: |
          set -e
          temoin=tools/testdata/version-de-go-divergente
          echo "  version de Go — sens succès :"
          ./tools/verifie-version-de-go.sh
          # ADR 013 : un garde est livré avec le cas qui le fait échouer.
          echo "  version de Go — sens échec :"
          if ./tools/verifie-version-de-go.sh \
               "$temoin/go.mod.temoin" "$temoin/Dockerfile.temoin" \
               "$temoin/Containerfile.temoin" >/dev/null 2>&1; then
            echo "  LE GARDE NE GARDE PLUS : le témoin de divergence est passé" >&2
            exit 1
          fi
          echo "    refus confirmé sur $temoin"
          echo "  encodage — sens succès :"
          ./tools/verifie-encodage.sh
          echo "  encodage — sens échec :"
          ./tools/verifie-encodage.sh --temoin

  ci:generateur:
    desc: "Le critere de #17 : un projet GENERE passe `task check` sans retouche"
    silent: true
    cmds:
      # C'est la seule garantie qui compte pour un generateur. Tout le reste --
      # il compile, il ecrit des fichiers -- se verifie en le regardant tourner.
      # « Le projet genere franchit la meme barriere que le socle » ne se verifie
      # qu'en le faisant.
      #
      # C'est aussi ce qui a trouve que `tools/covergate` portait le nom du socle
      # EN DUR : dans un projet genere, aucune exclusion ne correspondait plus et
      # les cliquets mesuraient un perimetre qui n'etait pas le leur.
      - cmd: |
          set -e
          bac=$(mktemp -d)
          # `trap ... EXIT` seul : le shell de la toolbox (busybox) refuse
          # les noms de signaux ici, et EXIT couvre déjà l'interruption.
          trap 'rm -rf "$bac"' EXIT
          go build -o "$bac/hexa" ./cmd/hexa
          echo "  génération :"
          "$bac/hexa" new "$bac/projet" --module github.com/exemple/projet-genere | sed 's/^/    /'
          echo "  barrière dans le projet généré :"
          cp .env.example "$bac/projet/.env"
          ( cd "$bac/projet" && task check ) > "$bac/check.log" 2>&1 || {
            echo "  LE PROJET GÉNÉRÉ NE PASSE PAS LA BARRIÈRE :" >&2
            tail -30 "$bac/check.log" >&2
            exit 1
          }
          grep -E "cliquet|périmètre|cœur|code produit" "$bac/check.log" | sed 's/^/  /'
          echo "    task check dans le projet généré : 0"

  ci:images:
    desc: "Construit les deux images livrées — le job docker"
    cmds:
      # Le contexte est `.`, et c'est bien le chemin vu par le CONTENEUR — pas
      # celui de l'hôte. La distinction n'est pas intuitive et coûte un
      # diagnostic si on la prend à l'envers :
      #
      #   docker build <ctx>   le CLIENT empaquette le répertoire et le transmet
      #                        → chemin côté client, donc /src
      #   docker run -v a:b    le MOTEUR résout le montage
      #                        → chemin côté hôte, donc $HEXA_HOST_ROOT
      #
      # Pris à l'envers, le message est « path not found » sur un chemin qui
      # existe pourtant — sous les yeux, mais pas dans le bon espace de noms.
      - cmd: |
          set -e
          for c in server worker; do
            printf '  image %-8s' "$c"
            docker build -q --build-arg CMD="$c" -t "localhost/hexa-$c:ci" . >/dev/null
            echo " ok"
          done

  ci:pr-title:
    desc: 'Le job pr-title : task ci:pr-title -- "feat(scope): description"'
    silent: true
    cmds:
      - cmd: |
          titre={{.CLI_ARGS}}
          if echo "$titre" | grep -Eq '^(feat|fix|sec|refactor|test|docs|perf|ci|chore|build)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "  titre conforme : $titre"
          else
            echo "  titre NON conforme : $titre" >&2
            echo "  attendu : {type}({scope}): {description}" >&2
            exit 1
          fi

  ci:inertia:
    desc: 'Le job inertia : task ci:inertia -- <ref-de-base>'
    silent: true
    cmds:
      - cmd: |
          base={{.CLI_ARGS}}
          [ -n "$base" ] || { echo "  usage : task ci:inertia -- <ref-de-base>" >&2; exit 1; }
          fail=0
          # UNE seule définition, partagée avec `ci.yml` : le script. Il porte
          # le motif, les exclusions motivées, et le garde anti-pourriture.
          echo "  sens succès — le dépôt réel :"
          ./tools/verifie-mention-outillage.sh "$base" HEAD || fail=1
          # ADR 013 : le garde est livré avec le cas qui le fait échouer.
          echo "  sens échec — les témoins :"
          ./tools/verifie-mention-outillage.sh --temoin || fail=1
          zones=$(git diff --name-only "$base" HEAD | grep -E '^(rules/|arch-go\.yml|\.golangci\.yml|internal/pkg/|migrations/)' || true)
          if [ -n "$zones" ]; then
            echo "  zones à haute inertie touchées — ADR ou label inertia:justified exigé :"
            echo "$zones" | sed 's/^/    /'
          else
            echo "  aucune zone à haute inertie touchée"
          fi
          exit "$fail"

  fmt:
    desc: Formate le code
    cmds:
      - go fmt ./...
      - go mod tidy

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint (config ultra-stricte)
    cmds:
      - golangci-lint run ./...

  arch:
    desc: Vérifie les guardrails d'architecture (arch-go.yml)
    cmds:
      - arch-go --verbose

  vuln:
    desc: Scan de vulnérabilités des dépendances
    cmds:
      - govulncheck ./...

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    desc: 'Tests unitaires (sans -race : CGO absent sur Windows sans compilateur C)'
    cmds:
      # -coverpkg=./... est INDISPENSABLE ici, pas une option de confort.
      #
      # Les tests de ce dépôt sont en BOÎTE NOIRE : ils vivent dans `{paquet}/tests/`,
      # donc dans un paquet DIFFÉRENT du code qu'ils exercent. Sans -coverpkg, le
      # profil n'attribue la couverture qu'au paquet de test lui-même, et le total
      # tombe à 3,6 % alors que la couverture réelle est de 52 %.
      #
      # Un chiffre faux dans ce sens est le pire : il ferait échouer un cliquet de
      # couverture, puis quelqu'un baisserait le seuil pour « débloquer la CI » —
      # et le garde ne garderait plus rien.
      - go test -shuffle=on -coverprofile={{.COVER_PROFILE}} -covermode=count -coverpkg=./... ./...
      # Les cliquets sont appliqués par un PROGRAMME, pas par du shell dupliqué :
      # la CI lance exactement cette commande. Les seuils vivent à un seul
      # endroit, dans tools/covergate, et ils sont compilés.
      - go run ./tools/covergate {{.COVER_PROFILE}}

  test:race:
    desc: 'Tests + detecteur de courses (exige CGO : CI Linux)'
    cmds:
      - go test -race -shuffle=on -covermode=atomic ./...

  test:cover:
    desc: Rapport de couverture HTML
    deps: [test]
    cmds:
      - go tool cover -html={{.COVER_PROFILE}} -o coverage.html
      - go tool cover -func={{.COVER_PROFILE}} | tail -n 1

  test:e2e:
    desc: Tests end-to-end (nécessite `task up` puis `task run`)
    cmds:
      - go test -tags=e2e -count=1 -v ./tests/e2e/...

  test:perf:
    desc: Test de charge k6 (nécessite l'API démarrée)
    cmds:
      - k6 run tests/perf/registration.js

  # ── Contrat d'API ───────────────────────────────────────────────────────────
  openapi:
    desc: Régénère api/openapi.yaml depuis le code (source de vérité = les structs Go)
    cmds:
      - go run ./cmd/server --openapi > api/openapi.yaml
      - cmd: echo "api/openapi.yaml régénéré"

  # ── Maintenance ─────────────────────────────────────────────────────────────
  # Le chemin de module est la SEULE valeur nominative du dépôt. C'est cette
  # tâche qui rend le socle réutilisable — et c'est elle qu'exerceront le premier
  # transfert de propriétaire comme chaque `hexa new`.
  #
  # Elle ne se limite donc pas aux fichiers Go. Deux fichiers de configuration
  # portent le chemin, et les oublier ne casse rien tout de suite — ce qui est
  # exactement le problème :
  #
  #   .golangci.yml  `goimports.local-prefixes`. Le module renommé cesse d'être
  #                  reconnu comme local : goimports reclasse TOUS les imports du
  #                  projet en tiers et veut réordonner chaque bloc. `task fmt` et
  #                  `task lint` divergent alors sur des centaines de fichiers,
  #                  chez quelqu'un qui n'a écrit aucun d'eux.
  #
  #   Dockerfile     `org.opencontainers.image.source`. Chaque image annoncerait
  #                  la provenance du dépôt d'ORIGINE. Une provenance fausse est
  #                  un problème de chaîne d'approvisionnement, pas de cosmétique.
  #
  # La dernière étape VÉRIFIE qu'il ne reste rien. Sans elle, le prochain fichier
  # qui portera le chemin rouvrira le trou en silence, et on ne l'apprendra qu'au
  # rename suivant — c'est-à-dire chez un utilisateur.
  rename:
    desc: 'Change le module path : task rename -- github.com/moi/mon-projet'
    cmds:
      - go mod edit -module {{.CLI_ARGS}}
      - cmd: |
          git ls-files '*.go' | xargs sed -i 's|{{.MODULE}}|{{.CLI_ARGS}}|g'
          sed -i 's|{{.MODULE}}|{{.CLI_ARGS}}|g' .golangci.yml Dockerfile
        platforms: [linux, darwin]
      - cmd: >-
          powershell -NoProfile -Command "Get-ChildItem -Recurse -Filter *.go |
          ForEach-Object { (Get-Content $_.FullName -Raw) -replace
          [regex]::Escape('{{.MODULE}}'), '{{.CLI_ARGS}}' |
          Set-Content $_.FullName -NoNewline -Encoding utf8 };
          @('.golangci.yml','Dockerfile') | ForEach-Object {
          (Get-Content $_ -Raw) -replace [regex]::Escape('{{.MODULE}}'),
          '{{.CLI_ARGS}}' | Set-Content $_ -NoNewline -Encoding utf8 }"
        platforms: [windows]
      - go mod tidy
      - go build ./...
      - task: rename:verify
        vars: { FROM: '{{.MODULE}}' }

  rename:verify:
    desc: "Vérifie qu'aucune trace du chemin de module d'origine ne subsiste"
    internal: true
    cmds:
      # EXCLUSIONS DÉCLARÉES, et non oubliées : ces fichiers citent le chemin dans
      # des liens vers des PR et des ISSUES historiques — CLAUDE.md, REPRISE.md,
      # et l'en-tête « Issue » de chaque ADR. Les réécrire ferait pointer
      # l'historique du socle vers un dépôt qui ne l'a jamais porté. GitHub
      # redirige les URL d'un dépôt transféré, donc ces liens restent valides.
      #
      # La liste est identique à `citeLeSocleParHistoire` dans cmd/hexa, et pour
      # la même raison. Les deux doivent bouger ensemble.
      #
      # Toute AUTRE occurrence est un oubli, et fait échouer la tâche.
      - cmd: |
          restant=$(git ls-files \
            | grep -v -e '^CLAUDE\.md$' -e '^documentation/process/REPRISE\.md$' \
                      -e '^documentation/adr/' \
            | xargs grep -l '{{.FROM}}' 2>/dev/null || true)
          if [ -n "$restant" ]; then
            echo "task rename : le chemin d'origine subsiste dans :" >&2
            echo "$restant" | sed 's/^/  /' >&2
            echo "" >&2
            echo "Ajouter le fichier à la tâche rename, ou l'inscrire dans les" >&2
            echo "exclusions déclarées de rename:verify — jamais le laisser passer." >&2
            exit 1
          fi
          echo "rename : aucune trace résiduelle hors exclusions déclarées."
        platforms: [linux, darwin]

  clean:
    desc: Supprime les artefacts de build
    cmds:
      - cmd: rm -rf {{.BIN}} {{.COVER_PROFILE}} coverage.html
        platforms: [linux, darwin]
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.BIN}}, {{.COVER_PROFILE}}, coverage.html"
        platforms: [windows]

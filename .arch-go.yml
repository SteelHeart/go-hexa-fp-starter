# arch-go — https://github.com/fdaines/arch-go
#
# C'est le fichier le plus important du dépôt : il transforme les règles
# d'architecture en test automatisé. Sans lui, l'hexagone se dégrade en trois
# semaines. Exécuter avec `task arch`.
version: 1

threshold:
  compliance: 100

dependenciesRules:
  # ── 1. Le domaine est absolument pur ────────────────────────────────────────
  # Aucune dépendance externe, aucune infrastructure. Il ne dépend que des
  # primitives fonctionnelles (Result, fp) qui sont elles-mêmes pures.
  - package: "**.internal.features.*.domain"
    shouldOnlyDependsOn:
      internal:
        - "**.internal.pkg.result"
        - "**.internal.pkg.fp"
      external: []

  # ── 2. Les ports ne sont que des signatures ─────────────────────────────────
  # Ils peuvent nommer le domaine et les primitives, rien d'autre.
  - package: "**.internal.features.*.ports"
    shouldOnlyDependsOn:
      internal:
        - "**.internal.features.*.domain"
        - "**.internal.pkg.result"
        - "**.internal.pkg.fp"
      external: []

  # ── 3. L'application orchestre, elle n'implémente pas ───────────────────────
  # Elle ne doit JAMAIS voir un adaptateur ni l'infrastructure : sinon
  # l'inversion de dépendance est rompue.
  - package: "**.internal.features.*.application"
    shouldNotDependsOn:
      internal:
        - "**.internal.features.*.adapters.**"
        - "**.internal.infrastructure.**"

  # ── 4. Étanchéité entre bounded contexts ────────────────────────────────────
  # Une feature ne parle jamais directement à une autre : elle passe par le
  # LANGAGE PUBLIÉ (internal/contracts) puis par un événement ou un appel de
  # module résolu par modulebus. Jamais par un import direct, jamais par la base
  # de l'autre module (ADR 011).
  - package: "**.internal.features.user_registration.**"
    shouldNotDependsOn:
      internal:
        - "**.internal.features.!(user_registration).**"

  # ── 4b. Le langage publié ne dépend de rien ─────────────────────────────────
  # internal/contracts ne contient que des types primitifs sérialisables. S'il
  # importait un domaine, il recréerait le couplage qu'il sert à éviter.
  - package: "**.internal.contracts.**"
    shouldOnlyDependsOn:
      internal: []
      external: []

  # ── 5. Le socle ne connaît pas les features ─────────────────────────────────
  # La dépendance va toujours de l'extérieur vers l'intérieur.
  - package: "**.internal.infrastructure.**"
    shouldNotDependsOn:
      internal:
        - "**.internal.features.**"

  # ── 6. Les primitives sont sans dépendance ──────────────────────────────────
  - package: "**.internal.pkg.result"
    shouldOnlyDependsOn:
      internal: []
      external: []

  - package: "**.internal.pkg.fp"
    shouldOnlyDependsOn:
      internal: []
      external: []

  # ── 7. La config est immuable et sans dépendance interne ────────────────────
  - package: "**.config"
    shouldNotDependsOn:
      internal:
        - "**.internal.**"

contentsRules:
  # Le domaine ne contient pas d'interfaces : les contrats sont des types
  # fonction déclarés dans ports/.
  - package: "**.internal.features.*.domain"
    shouldNotContainInterfaces: true

  # Les ports ne contiennent pas d'implémentation : ni struct, ni fonction.
  - package: "**.internal.features.*.ports"
    shouldNotContainFunctions: true
    shouldNotContainStructs: true

functionsRules:
  # Des fonctions courtes et peu paramétrées sont la condition de la
  # composabilité. Ces seuils sont volontairement serrés.
  - package: "**.internal.features.**"
    maxParameters: 4
    maxReturnValues: 2
    maxLines: 50
    maxPublicFunctionPerFile: 6

  - package: "**.internal.pkg.**"
    maxParameters: 4
    maxReturnValues: 3
    maxLines: 40
